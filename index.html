<!DOCTYPE html>
<html>

<head>
<title>Arkanoid</title>
</head>

<body>

	<div class="buttons-container">
		<button onclick='loginFB()'> Login Facebook </button>
		<button onclick='logoutFB()'> Logout </button>
	</div>

<canvas id="myCanvas" width="800" height="600" style="border: 1px solid #000000;">
</canvas>

<script type="module" src="./src/js/main.js"></script>

<script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>

<script>

	//Facebook
	var fb_logged = false;
	var fb_imageLoaded = false;
	var fb_image = new Image;
	
	window.fbAsyncInit = function() 
	{
		FB.init(
			{
				appId            : '1638076956700090',
				autoLogAppEvents : true, 
				xfbml            : true, 
				version          : 'v17.0'
			}
		);
	};
	
	function loginFB()
	{		
		FB.login(
			function(response)
			{
				console.log(response);
				if(response.status === 'connected')
				{
					fb_logged = true;
					drawProfileImage();
				}

			}, 
			{
				scope: 'public_profile',
			}
		);
		
		fb_logged = true;		
	}
	
	function logoutFB()
	{
		FB.logout(
			function(response)
			{
				console.log(response);
				fb_logged = false;
			}
		);
	}
	
	function statusFB()
	{
		FB.getLoginStatus(
			function(response)
			{
				console.log(response);
			}
		);
	}

	function drawProfileImage()
	{
		FB.api('/me', 
			{
				fields: 'picture.type(normal)'
			}, 
			function(response)
			{
				console.log(response);
				if(response.status === 'connected')
				{
					fb_imageLoaded = true;
				}
				
				fb_imageLoaded.onload = function()
				{
					context.drawImage(fb_image, 650, 500);
				};
				fb_image.src = response['picture']['data']['url'];				
			}
		);
	}	
	
</script>

</body>

</html>
